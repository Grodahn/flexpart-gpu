name: Technical validation gate

# Small deterministic technical gate (RISK-03.3G-01, Issue #6 point 4).
# Technical gate only: TECHNICAL_PASS does not establish scientific parity
# and does not close Issue #6. The full ETEX mini run never executes here;
# it stays local/manual (see extended-validation.yml and docs/ci-gates.md).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  technical-gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      FLEXPART_GPU_SOFTWARE: "1"
      WGPU_BACKEND: vulkan
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          path: flexpart-gpu

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run canonical meteorology contract tests
        run: |
          set -euo pipefail
          cd flexpart-gpu
          cargo test --lib meteorology::tests
          cargo test --lib meteorology::vertical::tests
          cargo test --test integration vertical_runtime
          cargo test --test meteorology_contract
          python3 scripts/test_oracle_run_manifest.py

      - name: Install Lavapipe (software Vulkan)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-tools
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"

      - name: Clone pinned FLEXPART 11.1 oracle
        run: |
          set -euo pipefail
          cd flexpart-gpu
          pinned=$(python3 -c 'import json; print(json.load(open("reference/flexpart-11.1.json"))["pinned_commit"])')
          echo "$pinned" | grep -qE '^[0-9a-f]{40}$'
          echo "Pinned oracle commit: $pinned"
          # Sibling checkout expected by scripts/compare-fortran.sh and run-etex.sh.
          rm -rf ../flexpart
          git clone https://gitlab.phaidra.org/flexpart/flexpart.git ../flexpart
          git -C ../flexpart checkout "$pinned"
          git -C ../flexpart rev-parse HEAD
          test -z "$(git -C ../flexpart status --porcelain)"

      - name: Clone pinned flex_extract 7.1.2 oracle
        run: |
          set -euo pipefail
          cd flexpart-gpu
          pinned=$(python3 -c 'import json; print(json.load(open("reference/flex-extract.json"))["pinned_commit"])')
          echo "$pinned" | grep -qE '^[0-9a-f]{40}$'
          echo "Pinned flex_extract commit: $pinned"
          rm -rf ../flex_extract
          git clone https://gitlab.phaidra.org/flexpart/flex_extract.git ../flex_extract
          git -C ../flex_extract checkout "$pinned"
          git -C ../flex_extract rev-parse HEAD
          test -z "$(git -C ../flex_extract status --porcelain)"

      - name: Run small deterministic technical gate
        run: |
          set -euo pipefail
          cd flexpart-gpu
          chmod +x scripts/ci-gate.sh scripts/vertical/flex_extract_etadot_oracle.sh
          scripts/ci-gate.sh --particles 1000 --require-flex-extract-oracle

      - name: Upload gate artifacts (reports, logs, manifests)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-technical-gate-${{ github.run_id }}
          path: flexpart-gpu/target/ci-gate/
          retention-days: 30
