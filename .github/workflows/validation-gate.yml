name: Technical validation gate

# Small deterministic technical gate (RISK-03.3G-01, Issue #6 point 4).
# Technical gate only: TECHNICAL_PASS does not establish scientific parity
# and does not close Issue #6. The full ETEX mini run never executes here;
# it stays local/manual (see extended-validation.yml and docs/ci-gates.md).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cache_audit:
        description: Run complete cold, warm and forced-clean technical gates
        type: boolean
        default: false

jobs:
  technical-gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      FLEXPART_GPU_SOFTWARE: "1"
      WGPU_BACKEND: vulkan
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          path: flexpart-gpu

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Identify runner image for Cargo cache
        id: cache-environment
        run: echo "image=$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Restore trusted Cargo compilation cache
        id: cargo-cache
        # Pull requests may read scoped trusted caches, but never publish them.
        # GitHub also prevents protected branches from reading feature/PR caches.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: "flexpart-gpu -> target"
          key: ubuntu-22.04-${{ runner.arch }}-default-features-${{ steps.cache-environment.outputs.image }}-${{ hashFiles('**/build.rs', '**/.cargo/config*') }}
          env-vars: "RUST CARGO CC CXX CFLAGS CXXFLAGS LDFLAGS"
          cache-targets: "false"
          # Only compiler artifacts enter the archive; reports/oracle outputs
          # are excluded even if the action cleanup cannot remove a file.
          cache-directories: |
            flexpart-gpu/target/debug/deps
            flexpart-gpu/target/debug/build
            flexpart-gpu/target/debug/.fingerprint
            flexpart-gpu/target/release/deps
            flexpart-gpu/target/release/build
            flexpart-gpu/target/release/.fingerprint
            flexpart-gpu/.cargo-cache-integrity
          cache-workspace-crates: "false"
          cache-bin: "false"
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Verify restored Cargo compilation bytes
        working-directory: flexpart-gpu
        run: python3 scripts/cargo_cache_integrity.py verify
      - name: Verify build-cache invalidation and atomic publication
        working-directory: flexpart-gpu
        run: |
          python3 scripts/test_agent_validation.py
          python3 scripts/test_oracle_build_cache.py
          python3 scripts/test_cargo_cache_integrity.py
      - name: Check Rust formatting
        working-directory: flexpart-gpu
        run: cargo fmt --all -- --check

      - name: Install Lavapipe (software Vulkan)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-tools
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"

      - name: Run full Rust library test suite
        working-directory: flexpart-gpu
        run: |
          set -euo pipefail
          mkdir -p target/ci-gate
          cargo test --lib > target/ci-gate/rust-lib.log 2>&1
          python3 scripts/check_ci_test_coverage.py --library-log target/ci-gate/rust-lib.log

      - name: Preserve validation case serialized contract
        working-directory: flexpart-gpu
        run: cargo test --test validation_case_contract

      - name: Preserve configuration facade and parser behavior
        working-directory: flexpart-gpu
        run: cargo test --test config_contract

      - name: Run canonical meteorology contract tests
        run: |
          set -euo pipefail
          cd flexpart-gpu
          # Host library assertions ran in the complete suite above.
          # Integration reports and the fresh ci-gate producers remain required.
          cargo test --test vertical_geometry_contract
          cargo test --test integration vertical_runtime
          cargo test --test integration vertical_sampling
          test -s target/ci-gate/vertical-sampling/vertical-model-level-regression.json
          test -s target/ci-gate/vertical-sampling/vertical-interface-w-production-oracle.json
          cargo test --test meteorology_contract
          python3 scripts/test_oracle_run_manifest.py

      - name: Clone pinned FLEXPART 11.1 oracle
        run: |
          set -euo pipefail
          cd flexpart-gpu
          pinned=$(python3 -c 'import json; print(json.load(open("reference/flexpart-11.1.json"))["pinned_commit"])')
          echo "$pinned" | grep -qE '^[0-9a-f]{40}$'
          echo "Pinned oracle commit: $pinned"
          # Sibling checkout expected by scripts/compare-fortran.sh and run-etex.sh.
          rm -rf ../flexpart
          git clone https://gitlab.phaidra.org/flexpart/flexpart.git ../flexpart
          git -C ../flexpart checkout "$pinned"
          git -C ../flexpart rev-parse HEAD
          test -z "$(git -C ../flexpart status --porcelain)"

      - name: Clone pinned flex_extract 7.1.2 oracle
        run: |
          set -euo pipefail
          cd flexpart-gpu
          pinned=$(python3 -c 'import json; print(json.load(open("reference/flex-extract.json"))["pinned_commit"])')
          echo "$pinned" | grep -qE '^[0-9a-f]{40}$'
          echo "Pinned flex_extract commit: $pinned"
          rm -rf ../flex_extract
          git clone https://gitlab.phaidra.org/flexpart/flex_extract.git ../flex_extract
          git -C ../flex_extract checkout "$pinned"
          git -C ../flex_extract rev-parse HEAD
          test -z "$(git -C ../flex_extract status --porcelain)"

      - name: Run small deterministic technical gate
        run: |
          set -euo pipefail
          cd flexpart-gpu
          chmod +x scripts/ci-gate.sh scripts/vertical/flex_extract_etadot_oracle.sh
          if [ "${{ inputs.cache_audit }}" = "true" ]; then
            python3 scripts/audit_build_cache.py
          else
            scripts/ci-gate.sh --particles 1000 --require-flex-extract-oracle
          fi

      - name: Reproduce nonuniform-column shared-height research oracle
        working-directory: flexpart-gpu
        run: |
          set -euo pipefail
          python3 scripts/interpolation/test_shared_height_oracle.py
          python3 scripts/interpolation/run_shared_height_oracle.py \
            --checkout ../flexpart --output-dir target/ci-gate/shared-height-oracle
      - name: Compare prepared GPU U/V against the freshly regenerated direct oracle
        working-directory: flexpart-gpu
        env:
          FLEXPART_GPU_SHARED_HEIGHT_ORACLE: target/ci-gate/shared-height-oracle/report.json
          FLEXPART_GPU_CANDIDATE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          cargo test --test shared_height_gpu -- --test-threads=1 --nocapture > target/ci-gate/shared-height-gpu.log 2>&1
          python3 scripts/interpolation/check_shared_height_gpu.py target/ci-gate/shared-height-gpu/comparison.json --software
          python3 scripts/interpolation/test_check_shared_height_gpu.py

      - name: Reproduce interior W four-control research oracle
        working-directory: flexpart-gpu
        run: |
          set -euo pipefail
          python3 scripts/interpolation/test_interior_w_oracle.py
          python3 scripts/interpolation/run_shared_height_oracle.py --interior-w \
            --checkout ../flexpart --output-dir target/ci-gate/interior-w-first
          python3 scripts/interpolation/run_shared_height_oracle.py --interior-w \
            --checkout ../flexpart --output-dir target/ci-gate/interior-w-second
          python3 scripts/interpolation/compare_interior_w_builds.py \
            --first target/ci-gate/interior-w-first --second target/ci-gate/interior-w-second \
            --output target/ci-gate/interior-w-reproducibility.json

      - name: Record dependency cache checksums
        working-directory: flexpart-gpu
        run: python3 scripts/cargo_cache_integrity.py record
      - name: Upload gate artifacts (reports, logs, manifests)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-technical-gate-${{ github.run_id }}
          path: |
            flexpart-gpu/target/ci-gate/
            flexpart-gpu/target/oracle-cache/
            flexpart-gpu/target/build-cache-audit/
          retention-days: 30
