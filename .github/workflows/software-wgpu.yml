        run: |
          set -euo pipefail
          cargo test --lib gpu::wet_deposition::tests -- --test-threads=1 --nocapture > target/ci-gate/wet-prefix.log 2>&1
          for active in 1 3 8; do
            grep -q "WET-PREFIX-138: .*capacity=8 active=$active" target/ci-gate/wet-prefix.log
