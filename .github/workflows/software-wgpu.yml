          FLEXPART_GPU_COMPACTION=0 FLEXPART_GPU_VALIDATION=0 RUST_LOG=flexpart_gpu=info cargo test --test forward_timeloop --test backward_timeloop -- --nocapture > target/ci-gate/timeloop-production.log 2>&1
          python3 scripts/check_ci_test_coverage.py --log target/ci-gate/timeloop-production.log --compaction 0 --validation 0 --backward
          FLEXPART_GPU_COMPACTION=0 FLEXPART_GPU_VALIDATION=1 RUST_LOG=flexpart_gpu=info cargo test --test forward_timeloop -- --nocapture > target/ci-gate/timeloop-validation.log 2>&1
          python3 scripts/check_ci_test_coverage.py --log target/ci-gate/timeloop-validation.log --compaction 0 --validation 1
